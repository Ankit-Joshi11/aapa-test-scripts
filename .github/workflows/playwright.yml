name: Hawk Search Sanity CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      working-directory: ./hawk-search-sanity
      run: npm install

    - name: Install Playwright Browsers
      working-directory: ./hawk-search-sanity
      run: npx playwright install --with-deps chromium

    - name: Run Hawk Search Sanity Tests
      working-directory: ./hawk-search-sanity
      run: npm test

    - name: Upload Executive Dashboard & Reports
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: hawk-search-dashboard
        path: hawk-search-sanity/reports/
        retention-days: 30

